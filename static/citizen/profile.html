<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile — Barangay Health Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="citizen-profile">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <div class="brand"><span class="dot" aria-hidden="true"></span>Barangay Health Monitor</div>
    <nav class="topnav" aria-label="Citizen navigation">
      <a href="/citizen/dashboard.html">Dashboard</a>
      <a href="/citizen/history.html">History</a>
      <a href="/citizen/consent.html">Consent</a>
      <a href="/citizen/profile.html" aria-current="page">Profile</a>
      <span id="whoami" class="whoami"></span>
      <button id="logoutBtn" class="btn btn-ghost" type="button">Log out</button>
    </nav>
  </header>

  <main id="main" class="page">
    <h1>My profile</h1>
    <p class="lede">Keep your details up to date. Your username cannot be changed.</p>

    <div id="status" aria-live="polite"></div>

    <div class="grid-2">
      <section class="card-surface" aria-labelledby="detailsHeading">
        <h2 id="detailsHeading">Personal details</h2>
        <p id="profileFeedback" class="form-success" role="status"></p>
        <p id="profileError" class="form-error" role="alert"></p>
        <form id="profileForm" novalidate>
          <div class="field">
            <label for="usernameReadonly">Username</label>
            <input id="usernameReadonly" type="text" readonly aria-readonly="true">
          </div>
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="full_name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="birthdate">Birthdate</label>
            <input id="birthdate" name="birthdate" type="date" required>
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button id="profileSubmit" class="btn btn-primary" type="submit">Save details</button>
        </form>
      </section>

      <section class="card-surface" aria-labelledby="passwordHeading">
        <h2 id="passwordHeading">Change password</h2>
        <p id="passwordFeedback" class="form-success" role="status"></p>
        <p id="passwordError" class="form-error" role="alert"></p>
        <form id="passwordForm" novalidate>
          <div class="field">
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="newPassword">New password</label>
            <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
            <p class="hint">At least 8 characters.</p>
          </div>
          <button id="passwordSubmit" class="btn btn-primary" type="submit">Update password</button>
        </form>
      </section>
    </div>

    <section class="section">
      <h2>Session</h2>
      <div class="btn-row">
        <button id="logoutBtnMain" class="btn btn-secondary" type="button">Log out of this device</button>
      </div>
    </section>
  </main>

  <footer class="foot">Your password is stored only as a bcrypt hash.</footer>
  <script src="/js/api.js"></script>
  <script src="/js/citizen.js"></script>
</body>
</html>
