<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BHW sign in — Barangay Health Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="bhw-login">
  <div class="auth-wrap">
    <header class="topbar">
      <div class="brand"><span class="dot" aria-hidden="true"></span>Barangay Health Monitor</div>
    </header>
    <main class="auth-main">
      <div class="auth-card">
        <h1>Health worker sign in</h1>
        <p class="lede">For Barangay Health Workers and administrators. Citizen accounts cannot open this portal.</p>
        <p id="loginError" class="form-error" role="alert"></p>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button id="loginSubmit" class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <p class="auth-note">Citizens sign in through the <a href="/citizen/login.html">citizen portal</a>.</p>
      </div>
    </main>
    <footer class="foot">All record access is written to an append-only audit trail.</footer>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/bhw.js"></script>
</body>
</html>
