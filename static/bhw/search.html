<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find citizens — Barangay Health Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="bhw-search">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <div class="brand"><span class="dot" aria-hidden="true"></span>Barangay Health Monitor</div>
    <nav class="topnav" aria-label="Health worker navigation">
      <a href="/bhw/dashboard.html">Dashboard</a>
      <a href="/bhw/search.html" aria-current="page">Find citizens</a>
      <a href="/bhw/audit-trail.html">Audit trail</a>
      <a href="/bhw/reports.html">Reports</a>
      <span id="whoami" class="whoami"></span>
      <button id="logoutBtn" class="btn btn-ghost" type="button">Log out</button>
    </nav>
  </header>

  <main id="main" class="page">
    <h1>Find a citizen</h1>
    <p class="lede">Search by name or username. The consent badge shows whether individual records may be opened.</p>

    <form id="searchForm" class="filters" role="search">
      <div class="field grow">
        <label for="searchInput">Name or username</label>
        <input id="searchInput" name="search" type="search" placeholder="e.g. carl" autocomplete="off">
      </div>
      <button id="searchBtn" class="btn btn-primary" type="submit">Search</button>
    </form>

    <div id="status" aria-live="polite"></div>
    <div id="results"></div>
  </main>

  <footer class="foot">Opening a record without consent is blocked by the server.</footer>
  <script src="/js/api.js"></script>
  <script src="/js/bhw.js"></script>
</body>
</html>
